name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The runner image ships no ffmpeg, and the resolve tests encode real
      # files. No pipes here: a pipe hides the exit code behind head.
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version
          docker compose version
      - name: suite
        run: python3 -m unittest discover -s tests -v
