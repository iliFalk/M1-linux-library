services:
  navidrome:
    # Pinned by digest: deluan/navidrome 0.64.2, the upstream multi-arch index.
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    restart: unless-stopped
    ports:
      # Bound to loopback by default; set NAVIDROME_BIND_ADDRESS=0.0.0.0 to
      # publish on every interface.
      - "${NAVIDROME_BIND_ADDRESS:-127.0.0.1}:${NAVIDROME_PORT:-4533}:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_PORT: "4533"
      # No default on purpose: compose fails instead of starting Navidrome with
      # a known admin password.
      ND_DEVAUTOCREATEADMINPASSWORD: "${NAVIDROME_ADMIN_PASSWORD:?NAVIDROME_ADMIN_PASSWORD must be set, copy .env.example to .env and fill it in}"
    volumes:
      # The pipeline's library_root (MUSIC_LIBRARY_ROOT), mounted at /music.
      - "${MUSIC_LIBRARY_ROOT:-./library}:/music:ro"
      # Navidrome's own database: users, play counts, played history and the
      # playlists a client creates. Without a named volume it lives in an
      # anonymous one, and a recreated container loses it.
      - "navidrome-data:/data"

volumes:
  navidrome-data:
